<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Docente - Creador de Presentaciones</title>
    <link rel="stylesheet" href="css/presentacion.css">
    <style>
        .form-container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .btn-volver {
            background-color: #7f8c8d;
            margin-bottom: 20px;
        }
        .btn-volver:hover {
            background-color: #707b7c;
        }
        .btn-guardar {
            background-color: #e67e22;
            width: 100%;
            padding: 12px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-guardar:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body style="display: block; height: auto; padding: 20px;">

    <div class="form-container">
        <a href="index.html" style="text-decoration: none;">
            <button class="btn-volver">← Volver al Menú Principal</button>
        </a>

        <h1 style="color: #2c3e50; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
            👨‍🏫 Modo Docente: Creador de Unidades Didácticas
        </h1>

        <form id="docente-form" onsubmit="descargarJsonConfiguracion(event)">
            <div class="form-group">
                <label for="institucion">Institución:</label>
                <input type="text" id="institucion" value="UCRISH" required>
            </div>

            <div class="form-group">
                <label for="asignatura">Asignatura:</label>
                <input type="text" id="asignatura" value="Tecnología" required>
            </div>

            <div class="form-group">
                <label for="grado">Grado / Curso:</label>
                <input type="text" id="grado" value="9.º grado" required>
            </div>

            <div class="form-group">
                <label for="semana">Número de Semana:</label>
                <input type="text" id="semana" value="1" required>
            </div>

            <div class="form-group">
                <label for="tema">Tema Principal:</label>
                <input type="text" id="tema" value="Tipos de computadoras" required>
            </div>

            <div class="form-group">
                <label for="objetivos">Objetivos (separados por saltos de línea):</label>
                <textarea id="objetivos">Identificar las clases de computadoras.
Comprender sus diferencias de uso.</textarea>
            </div>

            <div class="form-group">
                <label for="palabrasSopa">Palabras clave para Sopa de Letras (separadas por comas):</label>
                <input type="text" id="palabrasSopa" value="COMPUTADORA, LAPTOP, TABLET, SERVIDOR, RED">
            </div>

            <button type="submit" class="btn-guardar">📥 Descargar Archivo JSON de la Semana</button>
        </form>
    </div>

    <script>
        function descargarJsonConfiguracion(event) {
            event.preventDefault();
            
            const numSemana = document.getElementById('semana').value.trim();
            const semanaStr = numSemana.padStart(2, '0'); // Formato 01, 02...

            const configuracion = {
                "curso": {
                    "institucion": document.getElementById('institucion').value,
                    "asignatura": document.getElementById('asignatura').value,
                    "grado": document.getElementById('grado').value,
                    "semana": parseInt(numSemana),
                    "tema": document.getElementById('tema').value
                },
                "diapositivas": [
                    {
                        "titulo": `Semana ${numSemana}: ${document.getElementById('tema').value}`,
                        "contenido": `Bienvenidos a la asignatura de ${document.getElementById('asignatura').value}. Unidad dedicada a ${document.getElementById('tema').value}.`,
                        "busquedaImagen": document.getElementById('tema').value
                    }
                ],
                "actividades": {
                    "sopaLetras": {
                        "palabras": document.getElementById('palabrasSopa').value.split(',').map(p => p.trim())
                    },
                    "test": {
                        "preguntas": [
                            {
                                "pregunta": `¿Cuál es el tema principal estudiado en la semana ${numSemana}?`,
                                "opciones": [document.getElementById('tema').value, "Matemáticas avanzadas", "Historia antigua", "Química orgánica"],
                                "correcta": 0,
                                "retroalimentacion": "Correcto, ese es el tema central abordado en esta unidad."
                            }
                        ]
                    }
                },
                "recursos": [
                    { "titulo": "Material complementario de apoyo", "url": "#" }
                ]
            };

            // Crear un archivo descargable con formato JSON
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(configuracion, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `semana-${semanaStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            alert(`¡Archivo "semana-${semanaStr}.json" generado y descargado con éxito! Súbelo a tu carpeta "datos/" en GitHub.`);
        }
    </script>

</body>
</html>
