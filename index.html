<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Inteligente de Presentaciones Educativas</title>
    <link rel="stylesheet" href="css/presentacion.css">
    <style>
        .menu-container {
            text-align: center;
            max-width: 600px;
            margin: auto;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .btn-docente {
            background-color: #e67e22;
        }
        .btn-docente:hover {
            background-color: #d35400;
        }
        .btn-estudiante {
            background-color: #27ae60;
        }
        .btn-estudiante:hover {
            background-color: #219653;
        }

<body>
    <div id="app-container" class="menu-container">
        <header id="curso-header" style="border: none;">
            <span>Plataforma UCRISH</span>
        </header>

        <main id="slide-viewer">
            <h1 style="color: #2c3e50; font-size: 28px;">🎓 Generador Inteligente de Presentaciones Educativas</h1>
            <p style="color: #666; font-size: 16px; line-height: 1.5; margin-top: 15px;">

            </p>

            <div class="btn-group">
                <a href="creador.html" style="text-decoration: none;">
                    <button class="btn-docente">👨‍🏫 Modo Docente (Creador)</button>
                </a>
                <a href="presentacion.html" style="text-decoration: none;">
                    <button class="btn-estudiante">👁️ Ver Semana 6 (Estudiante)</button>
                </a>
            </div>
        </main>

        <footer id="navegacion-footer" style="justify-content: center; font-size: 13px; color: #888;">
            Estructura modular por semanas y asignaturas &bull; UCRISH
        </footer>
    </div>
