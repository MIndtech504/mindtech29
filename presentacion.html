<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación Interactiva - Estudiante</title>
    <link rel="stylesheet" href="css/presentacion.css">
</head>
<body>
    <div id="app-container">
        <!-- Encabezado de la lección -->
        <header id="curso-header">
            <span id="info-institucion">Cargando...</span> | <span id="info-asignatura">Asignatura</span> - <span id="info-tema">Tema</span>
        </header>

        <!-- Contenedor principal de diapositivas -->
        <main id="slide-viewer">
            <h2 id="slide-title">Cargando presentación...</h2>
            <div id="slide-content">Por favor espere un momento.</div>
        </main>

        <!-- Barra de navegación del estudiante -->
        <footer id="navegacion-footer">
            <button id="btn-anterior" onclick="cambiarSlide(-1)">← Anterior</button>
            <span id="indicador-paginas">1 / 1</span>
            <button id="btn-siguiente" onclick="cambiarSlide(1)">Siguiente →</button>
        </footer>
    </div>

    <!-- Scripts de actividades y evaluación -->
    <script src="js/actividades.js"></script>
    <script src="js/evaluacion.js"></script>
    <script src="js/presentacion.js"></script>
</body>
</html>
